<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archive — Julien's AI Brief</title>
  <meta name="description" content="Every issue of Julien's AI Brief. Search past issues by topic, company or paper.">
  <link rel="canonical" href="https://julienhovan.com/AI-News-Reports/archive/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23c2410c'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' font-weight='700' fill='white' text-anchor='middle'%3EJH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../styles.css?v=5">
</head>
<body>
  <div class="site">
    <header class="nav">
      <a class="brand" href="../index.html">
        <span class="avatar" aria-hidden="true">JH</span>
        <span><span class="wordmark">Julien's AI Brief</span><br><span class="byline">by Julien Hovan</span></span>
      </a>
      <nav class="navlinks" aria-label="Main">
        <a href="./" aria-current="page">Archive</a>
        <a class="hide-sm" href="../issue.html">Latest</a>
        <a class="btn sm" href="../index.html#subscribe">Subscribe</a>
      </nav>
    </header>

    <main>
      <div class="arch-head">
        <h1>Archive</h1>
        <p id="arch-desc">Every issue, newest first. Search by topic, company or paper.</p>
      </div>

      <div class="toolbar" role="search">
        <div class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="visually-hidden" for="q">Search issues</label>
          <input id="q" type="search" placeholder="Search issues: “DeepSeek”, “agents”, “funding”…" autocomplete="off">
          <span class="kbd" aria-hidden="true">/</span>
        </div>
        <div class="viewtog" role="group" aria-label="View">
          <button type="button" data-view="cards" aria-pressed="true">Cards</button>
          <button type="button" data-view="list" aria-pressed="false">List</button>
        </div>
      </div>
      <div class="chips topic-chips hidden" id="tags" role="group" aria-label="Filter by topic"></div>
      <p class="result-count" id="count" aria-live="polite"></p>

      <div id="results">
        <div class="month"><span class="skel skel-line sm" style="display:block;width:160px"></span></div>
        <div class="issues">
          <div class="skel skel-card"></div><div class="skel skel-card"></div>
          <div class="skel skel-card"></div><div class="skel skel-card"></div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span>© 2026 Julien's AI Brief · Julien Hovan</span>
      <span><a href="./">Archive</a> · <a href="../issue.html">Latest issue</a></span>
    </footer>
  </div>

  <div class="stickycta hidden" id="cta" role="region" aria-label="Subscribe">
    <span>Get the next issue in your inbox</span>
    <a class="btn" href="../index.html#subscribe">Subscribe</a>
    <button type="button" class="x" id="cta-close" aria-label="Dismiss">×</button>
  </div>

  <script src="../site.js?v=5"></script>
  <script>
    (function () {
      const B = window.Brief;
      const CTA_KEY = 'brief.archiveCtaDismissed';
      const VIEW_KEY = 'brief.archiveView';

      const qInput = document.getElementById('q');
      const tagsEl = document.getElementById('tags');
      const resultsEl = document.getElementById('results');
      const countEl = document.getElementById('count');

      const params = new URLSearchParams(location.search);
      const state = {
        q: params.get('q') || '',
        tag: params.get('tag') || 'All',
        view: safeGet(VIEW_KEY) === 'list' ? 'list' : 'cards',
      };
      let reports = [];
      let latestId = null;
      let knownTags = [];

      qInput.value = state.q;

      function safeGet(key) { try { return localStorage.getItem(key); } catch (_) { return null; } }
      function safeSet(key, val) { try { localStorage.setItem(key, val); } catch (_) { /* private mode */ } }

      // ---- sticky subscribe bar ----
      const cta = document.getElementById('cta');
      if (safeGet(CTA_KEY) !== '1') cta.classList.remove('hidden');
      document.getElementById('cta-close').addEventListener('click', () => {
        cta.classList.add('hidden');
        safeSet(CTA_KEY, '1');
      });

      // ---- view toggle ----
      const viewButtons = document.querySelectorAll('.viewtog button');
      function syncView() {
        viewButtons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
      }
      viewButtons.forEach((b) => b.addEventListener('click', () => {
        state.view = b.dataset.view;
        safeSet(VIEW_KEY, state.view);
        syncView();
        render();
      }));
      syncView();

      // ---- search ----
      qInput.addEventListener('input', () => {
        state.q = qInput.value.trim();
        syncUrl();
        render();
      });
      qInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          if (qInput.value) { qInput.value = ''; state.q = ''; syncUrl(); render(); } else qInput.blur();
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key !== '/' || e.metaKey || e.ctrlKey || e.altKey) return;
        const el = document.activeElement;
        if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
        e.preventDefault();
        qInput.focus();
        qInput.select();
      });

      function syncUrl() {
        const p = new URLSearchParams();
        if (state.q) p.set('q', state.q);
        if (state.tag !== 'All') p.set('tag', state.tag);
        const qs = p.toString();
        history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash);
      }

      // ---- topic chips ----
      function renderTags() {
        if (!knownTags.length) { tagsEl.classList.add('hidden'); return; }
        tagsEl.classList.remove('hidden');
        tagsEl.innerHTML = ['All'].concat(knownTags).map((t) =>
          `<button type="button" class="chip" data-tag="${B.escapeHtml(t)}" aria-pressed="${t === state.tag}">${B.escapeHtml(t)}</button>`
        ).join('');
      }
      tagsEl.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-tag]');
        if (!btn) return;
        state.tag = btn.dataset.tag;
        tagsEl.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
        syncUrl();
        render();
      });

      // ---- filtering + rendering ----
      function haystack(r) {
        return [r.issue_title, r.headline, r.tldr, B.listOf(r.top_stories).join(' '), r.title, B.rangeOf(r)]
          .filter(Boolean).join(' \n ').toLowerCase();
      }

      function matches(r) {
        if (state.tag !== 'All' && !B.listOf(r.tags).includes(state.tag)) return false;
        return !state.q || haystack(r).includes(state.q.toLowerCase());
      }

      function rowHtml(r) {
        const q = state.q;
        const sub = r.tldr || B.otherStories(r)[0] || '';
        const tags = B.listOf(r.tags).slice(0, 2);
        return `
<a class="crow" href="${B.escapeHtml(B.issueHref(r.id))}">
  <span class="d">${B.escapeHtml(B.formatDay(r.generated_at || r.date_range_end))}${r.id === latestId ? ' <span class="new">NEW</span>' : ''}</span>
  <span><span class="t">${B.highlight(B.headingOf(r), q)}</span>${sub ? `<br><span class="meta">${B.highlight(sub, q)}</span>` : ''}</span>
  ${tags.length
    ? `<span class="chips">${tags.map((t) => `<span class="chip">${B.escapeHtml(t)}</span>`).join('')}</span>`
    : `<span class="count">${B.escapeHtml(B.itemsLabel(r))}</span>`}
</a>`;
      }

      function render() {
        const list = reports.filter(matches);
        const filtered = state.q || state.tag !== 'All';
        countEl.textContent = filtered
          ? `${list.length} of ${reports.length} issues`
          : '';

        if (!list.length) {
          const where = state.tag !== 'All' ? ` in ${state.tag}` : '';
          resultsEl.innerHTML = `<div class="empty">No issues match${state.q ? ` “${B.escapeHtml(state.q)}”` : ''}${B.escapeHtml(where)}.
            <button type="button" class="linkbtn" id="clear">Clear filters</button></div>`;
          document.getElementById('clear').addEventListener('click', () => {
            state.q = ''; state.tag = 'All'; qInput.value = '';
            renderTags(); syncUrl(); render();
          });
          return;
        }

        const groups = [];
        list.forEach((r) => {
          const m = B.monthLabel(r.date_range_end);
          const last = groups[groups.length - 1];
          if (last && last.month === m) last.items.push(r);
          else groups.push({ month: m, items: [r] });
        });

        resultsEl.innerHTML = groups.map((g) => {
          const head = `<h2 class="month">${B.escapeHtml(g.month)} · ${g.items.length} issue${g.items.length === 1 ? '' : 's'}</h2>`;
          const body = state.view === 'cards'
            ? `<div class="issues">${g.items.map((r) => B.issueCardHtml(r, { query: state.q, isNew: r.id === latestId })).join('')}</div>`
            : `<div class="compact">${g.items.map(rowHtml).join('')}</div>`;
          return head + body;
        }).join('');
      }

      B.fetchArchive().then((data) => {
        reports = data.reports;
        latestId = reports.length ? reports[0].id : null;

        // Topic chips: every tag present in the data, most common first.
        const counts = new Map();
        reports.forEach((r) => B.listOf(r.tags).forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)));
        knownTags = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map((e) => e[0]);
        if (state.tag !== 'All' && !counts.has(state.tag)) { state.tag = 'All'; syncUrl(); }

        if (reports.length) {
          const oldest = reports[reports.length - 1];
          document.getElementById('arch-desc').textContent =
            `All ${reports.length} issues since ${B.monthLabel(oldest.date_range_end)}. Search by topic, company or paper.`;
        }
        renderTags();
        render();
      }).catch((err) => {
        console.warn('Could not load archive:', err);
        resultsEl.innerHTML = `<div class="load-error"><strong>Couldn't load the archive.</strong>
          Please check your connection and <a href="">try again</a>.</div>`;
      });
    })();
  </script>
</body>
</html>
